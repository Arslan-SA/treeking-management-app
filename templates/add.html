<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>add-trek</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='addtrek.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
  <div class="container">
    <aside class="sidebar">

      <ul>

        <li>
          <a href="/admin-dashboard"><i class="bi bi-house-door"></i> Dashboard
          </a>
        </li>
        <li><a href="/admin-treek"><i class="bi bi-backpack"></i> Treks</a></li>
        <li><a href="{{ url_for('admin_staff') }}"><i class="bi bi-person-badge"></i> Staff</a></li>
        <li><a href="{{ url_for('admin_users') }}"><i class="bi bi-people"></i> Users</a></li>
        <li><a href="{{ url_for('admin_bookings') }}"><i class="bi bi-calendar-check"></i> Bookings</a></li>
        <li><a href="{{ url_for('admin_search') }}"><i class="bi bi-search"></i> Search</a></li>
        <li><a href="{{ url_for('staff_approval') }}"><i class="bi bi-check2-square"></i> Approvals</a></li>
        <li><a href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
      </ul>

    </aside>

    <div class="main">
      <header class="navbar">

        <h1>Trekking Management Application</h1>

        <div class="profile">
          <i class="bi bi-person-circle"></i>
          <span>Admin</span>
          <i class="bi bi-chevron-down"></i>
        </div>

      </header>
      <div class="top-bar">
        <h2>Add New Trek</h2>
        <form
          action="{% if trek %}{{ url_for('edit_trek', trek_id=trek.id) }}{% else %}{{ url_for('add_trek') }}{% endif %}"
          method="POST">
          <label for="trek-name">Trek Name</label>
          <input type="text" id="trek-name" name="name" required value="{{ trek.name if trek else '' }}">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" required value="{{ trek.location if trek else '' }}">
          <label for="difficulty">Difficulty</label>

          <select name="difficulty" required id="select">

            <option value="easy" {% if trek and trek.difficulty=="easy" %}selected{% endif %}>
              Easy
            </option>

            <option value="medium" {% if trek and trek.difficulty=="medium" %}selected{% endif %}>
              Medium
            </option>

            <option value="tough" {% if trek and trek.difficulty=="tough" %}selected{% endif %}>
              Tough
            </option>

          </select>


          <label for="duration">Duration(Days)</label>
          <input type="number" id="duration" name="duration" value="{{ trek.duration if trek else '' }}" required>
          <label for="slots">Available Slots</label>
          <input type="number" id="slots" name="available_slots" required
            value="{{ trek.available_slots if trek else '' }}">
          <label for="date">Start Date</label>
          <input type="date" id="date" name="start_date"
            value="{{ trek.start_date.strftime('%Y-%m-%d') if trek else '' }}" required>
          <label for="end-date">End Date</label>
          <input type="date" id="end-date" name="end_date" required
            value="{{ trek.end_date.strftime('%Y-%m-%d') if trek else '' }}">
          <label for="staff" class="form-label">Assign Staff</label>
          <select class="form-select" id="staff" name="assigned_staff">


            <option value="">-- Select Staff --</option>

            {% for staff in staff_members %}

            <option value="{{ staff.id }}" {% if trek and trek.assigned_staff_id==staff.id %}selected{% endif %}>
              {{ staff.username }}
            </option>

            {% endfor %}

          </select>


          <label for="status" class="form-label">Status</label>


          <select id="status" name="status">

            {% for status in statuses %}
            <option value="{{ status }}" {% if trek and trek.status==status %}selected{% endif %}>{{ status }}</option>
            {% endfor %}

          </select>
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" name="description" rows="4"
            placeholder="Enter description...">{{ trek.description if trek else '' }}</textarea>
          <button type="submit">
            {% if trek %}
            Update Trek
            {% else %}
            Add Trek
            {% endif %}
          </button>
        </form>
      </div>
    </div>



</body>

</html>
